        function installChatLifecycle() {
          const eventMap = [
            ['MESSAGE_RECEIVED', 'message-received'],
            ['MESSAGE_UPDATED', 'message-updated'],
            ['GENERATION_ENDED', 'generation-ended'],
            ['CHARACTER_MESSAGE_RENDERED', 'character-message-rendered'],
            ['MESSAGE_SWIPED', 'message-swiped'],
            ['MESSAGE_DELETED', 'message-deleted'],
            ['CHAT_CHANGED', 'chat-changed'],
          ];
          const context = readContext();
          const catalogs = [window.tavern_events, window.event_types, window.eventTypes, context.tavern_events, context.event_types, context.eventTypes];
          const source = context.eventSource || window.eventSource;
          for (const [key, reason] of eventMap) {
            let name = '';
            for (const catalog of catalogs) {
              if (catalog && typeof catalog[key] === 'string') { name = catalog[key]; break; }
            }
            if (!name) continue;
            const listener = () => {
              if (reason === 'chat-changed') { void handleChatChanged(readChatKey()); return; }
              if (!sessionId) return;
              void publishLatestPresentation(reason);
            };
            if (typeof window.eventOn === 'function') {
              const stop = window.eventOn(name, listener);
              cleanups.push(typeof stop === 'function' ? stop : () => window.eventOff?.(name, listener));
            } else if (typeof source?.on === 'function') {
              source.on(name, listener);
              cleanups.push(() => source.off?.(name, listener));
            } else if (typeof source?.addEventListener === 'function') {
              source.addEventListener(name, listener);
              cleanups.push(() => source.removeEventListener?.(name, listener));
            }
          }
          const onFullscreen = () => {
            if (phase === 'ActiveNative' && document.fullscreenElement !== frame) {
              runtimeCore.setMode('pseudo');
              send('MODE_CHANGED', { mode });
            }
          };
          document.addEventListener('fullscreenchange', onFullscreen);
          cleanups.push(() => document.removeEventListener('fullscreenchange', onFullscreen));
          const onVisibility = () => {
            if (document.hidden) {
              send('VISIBILITY_HIDDEN', { visible: false });
              pauseHostAudio();
            }
            else send('VISIBILITY_RESTORED', { visible: true });
          };
          document.addEventListener('visibilitychange', onVisibility);
          cleanups.push(() => document.removeEventListener('visibilitychange', onVisibility));

          const onEscape = event => {
            if (event.key !== 'Escape' || !sessionId) return;
            event.preventDefault();
            void handleBackAction('escape');
          };
          window.addEventListener('keydown', onEscape, true);
          cleanups.push(() => window.removeEventListener('keydown', onEscape, true));
          const onPopState = () => {
            if (ignoredGuardPops > 0) {
              ignoredGuardPops -= 1;
              return;
            }
            if (!sessionId) return;
            historyGuardArmed = false;
            historyGuardToken = '';
            void Promise.resolve(handleBackAction('popstate')).finally(() => {
              if (sessionId) armBackGuard();
            });
          };
          window.addEventListener('popstate', onPopState);
          cleanups.push(() => window.removeEventListener('popstate', onPopState));
        }

        async function handleBackAction(source) {
          if (!sessionId || readChatKey() !== chatKey) return false;
          if (phase === 'ActiveNative') {
            await exitNative();
            runtimeCore.setMode('pseudo');
            send('MODE_CHANGED', { mode, reason: 'android-back-native-exit' });
            return true;
          }
          if (phase !== 'ActivePseudo') return false;
          send('ANDROID_BACK_REQUEST', { source: String(source || 'host-action') });
          return true;
        }

        function armBackGuard() {
          if (!sessionId || historyGuardArmed) return false;
          try {
            const token = sessionId + ':' + epoch;
            const currentState = history.state && typeof history.state === 'object' ? history.state : {};
            history.pushState({ ...currentState, __mgqImmersiveGuard: token }, '', location.href);
            historyGuardToken = token;
            historyGuardArmed = true;
            return true;
          } catch (_) {
            historyGuardToken = '';
            historyGuardArmed = false;
            return false;
          }
        }

        function disarmBackGuard() {
          const token = historyGuardToken;
          historyGuardToken = '';
          historyGuardArmed = false;
          try {
            if (token && history.state?.__mgqImmersiveGuard === token) {
              ignoredGuardPops += 1;
              history.back();
            }

        }

        function readContext() {
          const st = window.SillyTavern;
          try { return typeof st?.getContext === 'function' ? st.getContext.call(st) || {} : {}; } catch (_) { return {}; }
        }

        function readChatKey() {
          const context = readContext();
          const first = values => {
            for (const value of values) if (value !== null && value !== undefined && String(value).trim()) return String(value).trim();
            return '';
          };
          const chat = first([context.chatId, context.chat_id, context.selectedChat, context.selected_chat]);
          const character = first([context.characterId, context.character_id, context.this_chid]);
          return chat && character ? character + '::' + chat : chat || character || 'unknown-chat';
        }

        function assertLiveChatBinding(expectedChatKey) {

        function readLatestAssistant() {
          const context = readContext();
          const chat = Array.isArray(context.chat) ? context.chat : [];
          for (let index = chat.length - 1; index >= 0; index -= 1) {
            const record = chat[index];
            if (!record || record.is_user === true || record.is_system === true || record.role === 'user' || record.role === 'system') continue;
            const rawText = String(record.mes ?? record.message ?? '');
            const messageIdCandidates = normalizeIds([record.mesid, record.id, index, record.message_id]);
            return {
              chatKey: readChatKey(),
              floorIndex: index,
              messageId: messageIdCandidates[0] ?? index,
              messageIdCandidates,
              rawText,
              presentationSignature: signature(rawText),
            };
          }
          return null;
        }

        async function publishLatestPresentation(reason) {
          const latest = readLatestAssistant();
          if (!latest && reason === 'message-deleted') {
            compatibilityReason = '';
            return clearPresentation(reason);
          }
          const value = await readControllerPresentation(latest, reason);
          if (!value) {
            compatibilityReason = 'controller-unavailable-read-only';
            return false;
          }
          compatibilityReason = '';
          return present(value);
        }

        async function readControllerPresentation(snapshot, reason) {
          if (!snapshot) return null;
          const context = readContext();
          const candidates = [window.MGQController, window.MGQ, context.MGQController, context.MGQ];
          const controller = candidates.find(value => typeof value?.getMessagePresentation === 'function');
          if (!controller) return null;
          const request = {
            messageId: snapshot.messageId,
            messageIdCandidates: snapshot.messageIdCandidates,
            floorIndex: snapshot.floorIndex,
            chatKey: snapshot.chatKey,
            presentationSignature: snapshot.presentationSignature,
            reason,
          };
          try {
            const value = await Promise.resolve(controller.getMessagePresentation(request));
            if (!value || value.protocol !== config.presentationProtocol) return null;
            return { ...value, reason };
          } catch (_) {
            return null;
          }
        }

        function signature(text) {
          const visible = normalizePresentationSource(String(text || ''));
          let hash = 0x811c9dc5;
          for (let index = 0; index < visible.length; index += 1) {
            hash ^= visible.charCodeAt(index);
            hash = Math.imul(hash, 0x01000193) >>> 0;
          }
          return 'v1:' + hash.toString(16).padStart(8, '0') + ':' + visible.length;
        }

        function isOpeningMarker(value) {
          return normalizePresentationSource(String(value || '')) === '[MGQ_OPENING_UI]';
        }

        function detachedClone(value) {
          if (value === null || value === undefined) return value;
          try { return typeof structuredClone === 'function' ? structuredClone(value) : JSON.parse(JSON.stringify(value)); }
          catch (_) { return JSON.parse(JSON.stringify(value)); }
        }

                }
                const digest = await crypto.subtle.digest('SHA-256', bytes);
                const actual = [...new Uint8Array(digest)]
                  .map(value => value.toString(16).padStart(2, '0')).join('');
                if (actual !== String(metadata.sha256).toLowerCase()) {
                  throw new Error(name + ' SHA-256 hash mismatch');
                }
                return bytes;
              } catch (error) {
                lastError = error;
              }
            }
            throw new Error(name + ' verification failed: ' + String(lastError?.message || lastError || 'no mirror'));
          }

          function installVerifiedAssets(styleBytes, scriptBytes, bgmManifestBytes) {
            const decoder = new TextDecoder('utf-8', { fatal: true });
            if (bgmManifestBytes) {
              const bgmManifest = JSON.parse(decoder.decode(bgmManifestBytes));
              if (bgmManifest?.schema !== settings.bgmProtocol
                || !bgmManifest.files
                || typeof bgmManifest.files !== 'object'
                || Array.isArray(bgmManifest.files)) {
                throw new Error('bgm-manifest.json contract invalid');
              }
              window.__MGQ_BGM_RELEASE_MANIFEST__ = Object.freeze(bgmManifest);
            }
            const style = document.createElement('style');
            style.dataset.mgqVerifiedRelease = settings.buildId;
            style.textContent = decoder.decode(styleBytes);
            const script = document.createElement('script');
            script.dataset.mgqVerifiedRelease = settings.buildId;
            script.textContent = decoder.decode(scriptBytes);
            document.head.appendChild(style);
            document.head.appendChild(script);
          }

          function showError(message) {
            const root = document.getElementById('app');
            if (root) root.textContent = message + '。请返回酒馆后重试。';
            reportHostFailure(message);
          }

          function reportHostFailure(message) {
            if (hostErrorSent) return;
            hostErrorSent = true;
            send('HOST_ERROR', { message: String(message || 'host-error') });
          }
        }

        async function recoverHostOnce(reason) {
          if (recovering || !sessionId || !chatKey) return false;
          if (recoveryUsed) {
            const exhaustedRevision = ++lifecycleRevision;
            await failHostRecovery(reason, exhaustedRevision);
            return false;
          }
          const recoveryRevision = ++lifecycleRevision;
          if (!lastComplete) {
            recoveryUsed = true;
            await failHostRecovery(
              'host-recovery-requires-last-complete: ' + String(reason || 'unknown'),
              recoveryRevision,
            );
            return false;
          }
          recoveryUsed = true;
          recovering = true;
          const savedSessionId = sessionId;
          const savedChatKey = chatKey;
          const recoveredPresentation = Object.freeze({
            ...detachedClone(lastComplete),
            generation: 'complete',
            options: [],
            battle: null,
            readOnly: true,
            recovered: true,
            reason: 'host-recovery-read-only',
          });
          pauseHostAudio();
          abortController.abort();
          abortController = new AbortController();
          closeTransport();
          const nativeFrame = frame;
          resetFrame('host-recovery');
          runtimeCore.advanceEpoch();
          handledActionRequestIds.clear();
          try {
            await exitNative(nativeFrame);
            assertLifecycle(recoveryRevision);
            await ensureHost(savedChatKey, recoveryRevision);
            assertLifecycle(recoveryRevision);
            runtimeCore.startSession({
              sessionId: savedSessionId,
              chatKey: savedChatKey,
              epoch,
              mode: 'pseudo',
            });
            openingSession = false;
            openingAnchor = null;
            frame.style.display = 'block';
            send('SESSION_ENTER', {
              mode,
              recovery: true,
              readOnly: true,
              opening: openingSession,
              openingBinding: openingAnchor,
            });
            const accepted = runtimeCore.present(recoveredPresentation);
            if (!accepted) throw new Error('host-recovery-presentation-rejected');
            send(accepted.type, accepted.presentation);
            compatibilityReason = 'host-recovered-read-only';
            return true;
          } catch (error) {
            if (isLifecycleCurrent(recoveryRevision)) {
              await failHostRecovery(error?.message || reason, recoveryRevision);
            }
            return false;
          } finally {
            if (lifecycleRevision === recoveryRevision) recovering = false;
          }
        }

        async function failHostRecovery(reason, expectedRevision = lifecycleRevision) {
          if (destroyed || lifecycleRevision !== expectedRevision) return;
          terminalHostError = 'host-recovery-exhausted: ' + String(reason || 'unknown');
          runtimeCore.advanceEpoch();
          pauseHostAudio();
          abortController.abort();
          abortController = new AbortController();
          closeTransport();
          const nativeFrame = frame;
          resetFrame('host-recovery-failed');
          disarmBackGuard();
          unlockScroll();
          runtimeCore.clearPresentations();
          openingSession = false;
          openingAnchor = null;
          runtimeCore.endSession();
          showParentHostError(terminalHostError);
          await exitNative(nativeFrame);
        }

        function showParentHostError(message) {
          const old = document.querySelector('[data-mgq-host-terminal-error]');
          old?.remove?.();
          const panel = document.createElement('div');
          panel.dataset.mgqHostTerminalError = 'true';
          panel.style.cssText = 'position:fixed;z-index:2147483640;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,620px);padding:12px 48px 12px 14px;border:1px solid #b98a55;background:#211521;color:#f2dfc7;font:13px/1.6 sans-serif;';
          panel.textContent = '沉浸舞台连续加载失败，已安全返回酒馆。' + String(message || '');
          const close = document.createElement('button');
          close.type = 'button';
          close.textContent = '关闭';
          close.style.cssText = 'position:absolute;right:6px;top:6px;min-width:44px;min-height:44px;';
          close.addEventListener('click', () => panel.remove());
          panel.appendChild(close);
          document.body.appendChild(panel);
        }

        function pauseHostAudio() {
          try {
            for (const audio of frame?.contentDocument?.querySelectorAll?.('audio') || []) {
              audio.pause?.();
            }
          } catch (_) {}
        }

        function suppressLegacyParentAudio() {
          const selector = '.global-bgm-control audio, audio[data-mgq-bgm-owner], audio[data-mgq-bgm], audio[data-mgq-audio]';
          const stopIn = root => {
            try {
              for (const audio of root?.querySelectorAll?.(selector) || []) {
                audio.pause?.();
                audio.muted = true;
              }
            } catch (_) {}
          };
          stopIn(document);
          for (const candidate of document.querySelectorAll?.('iframe') || []) {
            if (candidate === frame) continue;
            try {
              stopIn(candidate.contentDocument);
              guardLegacyDocument(candidate.contentDocument, stopIn);
            } catch (_) {}
          }
        }

        function guardLegacyDocument(targetDocument, stopIn) {
          if (!targetDocument?.documentElement || guardedLegacyDocuments.has(targetDocument)) return;
          try {
            if (targetDocument.querySelector?.('[data-mgq-history-floor]')) return;
          } catch (_) {}
          guardedLegacyDocuments.add(targetDocument);
          try {
            const Observer = targetDocument.defaultView?.MutationObserver || window.MutationObserver;
            if (typeof Observer !== 'function') return;
            const observer = new Observer(records => {
              const hasAddition = records.some(record => record.addedNodes?.length);
              if (hasAddition) stopIn(targetDocument);
            });
            observer.observe(targetDocument.documentElement, { childList: true, subtree: true });
            legacyAudioObservers.add(observer);
          } catch (_) {}
        }

        function installLegacyAudioGuard() {
          if (typeof MutationObserver === 'function' && document.documentElement) {
            const observer = new MutationObserver(records => {
              const shouldScan = records.some(record => [...(record.addedNodes || [])].some(node => {
                if (node?.nodeType !== 1) return false;
                try {
                  return node.matches?.('iframe, audio, .global-bgm-control')
                    || Boolean(node.querySelector?.('iframe, audio, .global-bgm-control'));
                } catch (_) { return false; }
              }));
              if (shouldScan) suppressLegacyParentAudio();
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });
            cleanups.push(() => observer.disconnect());
          }
          const onLoad = event => {
            if (event.target?.tagName === 'IFRAME' && event.target !== frame) suppressLegacyParentAudio();
          };
          document.addEventListener('load', onLoad, true);
          cleanups.push(() => {
            document.removeEventListener('load', onLoad, true);
            for (const observer of legacyAudioObservers) observer.disconnect?.();
            legacyAudioObservers.clear();
          });
        }

        function closeTransport() {
          try { port?.close?.(); } catch (_) {}
          port = null;
          hostSource = null;
        }

        function resetFrame(reason = 'host-frame-reset') {
          const cancelBoot = bootCancel;
          bootCancel = null;
          bootPromise = null;
          bootRevision = -1;
          try { cancelBoot?.(reason); } catch (_) {}
          closeTransport();
          try { frame?.remove?.(); } catch (_) {}
          frame = null;
        }

        async function exitNative(targetFrame = frame) {
          try { if (targetFrame && document.fullscreenElement === targetFrame) await document.exitFullscreen(); } catch (_) {}
        }

        function lifecycleError(reason) {
          const error = new Error('host lifecycle invalidated: ' + String(reason || 'unknown'));
          error.name = 'AbortError';
          return error;
        }

        function isLifecycleCurrent(revision) {
          return !destroyed && Number(revision) === lifecycleRevision;
        }

        function assertLifecycle(revision) {
          if (!isLifecycleCurrent(revision)) throw lifecycleError(destroyed ? 'host-destroyed' : 'superseded');
        }

        function lockScroll() {
          previousHtmlOverflow = document.documentElement.style.overflow;
          previousBodyOverflow = document.body.style.overflow;
          document.documentElement.style.overflow = 'hidden';
          document.body.style.overflow = 'hidden';
        }

        function unlockScroll() {
          document.documentElement.style.overflow = previousHtmlOverflow;
          document.body.style.overflow = previousBodyOverflow;
        }

        function capabilities() {
          return {
            protocol: config.immersiveProtocol,
            presentationProtocol: config.presentationProtocol,
            statusProtocol: config.statusProtocol,
            persistent: true,
            sameOrigin: true,
            nativeFullscreen: !isIos(),
            buildId: activeRelease?.buildId || '',
          };
        }

        function getState() {
          return {
            ...runtimeCore.snapshot(),
            presentationProtocol: config.presentationProtocol,
            statusProtocol: config.statusProtocol,
            release: activeRelease,
            compatibilityReason,
          };
        }

        function isIos() {
          return /iPad|iPhone|iPod/i.test(navigator.userAgent) || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        }

        function normalizeIds(values) {
          const result = [];
          for (const candidate of Array.isArray(values) ? values : []) {
            if (candidate === null || candidate === undefined || candidate === '') continue;
            const number = Number(candidate);
            const value = Number.isInteger(number) && number >= 0 ? number : String(candidate).trim();
            if (value !== '' && !result.some(item => String(item) === String(value))) result.push(value);
          }
          return result;
        }
      } catch (error) {
        notify(false, error?.message || error);
      }
    }

    expand.addEventListener('click', () => {
      const open = floor.classList.toggle('is-expanded');
      expand.textContent = open ? '收起原文' : '展开原文';
      announceHeight();
    });
    inspect.addEventListener('click', () => {
      floor.classList.add('is-expanded');
      expand.textContent = '收起原文';
      showNote('正在查看本楼不可变快照；继续游戏会进入最新可操作楼层。');
    });
    continueButton.addEventListener('click', async () => {
      if (!messageContext) return;
      continueButton.disabled = true;
      showNote('正在打开常驻沉浸舞台…');
      try {
        await enterPersistentHost(messageContext, 'auto');
        showNote('沉浸舞台已打开；后续回复会继续显示在同一舞台中。');
      } catch (error) {
        showNote(error?.message || '沉浸舞台启动失败');
      } finally {
        continueButton.disabled = false;
      }
    });

    new ResizeObserver(announceHeight).observe(document.documentElement);
    buildMessageContext().then(context => {
      messageContext = context;
      globalThis.__MGQ_MESSAGE_CONTEXT__ = context;
      if (shouldAutoEnterOpening(context)) {
        void autoEnterOpening(context);
      } else {
        renderHistory(context);
        void prewarmPersistentHost(context);
      }
    }).catch(error => {
      state.textContent = '只读兼容';
      excerpt.textContent = error?.message || '无法读取本楼消息。';
      continueButton.disabled = true;
      announceHeight();
    });
  })();
  </script>
</body>
</html>
