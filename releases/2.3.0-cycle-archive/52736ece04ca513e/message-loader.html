<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MGQ 历史楼层</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { color-scheme: dark; }
    html, body { margin: 0; width: 100%; background: transparent; color: #e4d7bd; }
    body {
      padding: 8px 6px;
      font-family: "Noto Serif SC", "Source Han Serif SC", SimSun, serif;
      line-height: 1.72;
    }
    .history-floor {
      width: 100%;
      border: 1px solid rgba(186, 146, 78, .32);
      border-radius: 4px;
      background: linear-gradient(145deg, rgba(24, 17, 34, .96), rgba(10, 9, 18, .97));
      box-shadow: 0 9px 26px rgba(0, 0, 0, .24), inset 0 1px rgba(255, 244, 222, .04);
    }
    .history-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 42px; padding: 8px 12px; border-bottom: 1px solid rgba(186, 146, 78, .22);
    }
    .history-kicker { margin: 0; color: #c7a461; font: 700 11px/1.3 ui-sans-serif, sans-serif; letter-spacing: .14em; }
    .history-state { color: #9f91a8; font: 600 11px/1.3 ui-sans-serif, sans-serif; }
    .history-summary { display: flex; flex-wrap: wrap; gap: 6px; padding: 9px 12px 0; }
    .history-summary:empty { display: none; }
    .history-chip {
      padding: 2px 7px; border: 1px solid rgba(188, 151, 83, .24); border-radius: 2px;
      color: #cfc0a8; background: rgba(109, 55, 91, .16); font: 600 11px/1.55 ui-sans-serif, sans-serif;
    }
    .history-copy { position: relative; padding: 10px 12px 4px; }
    .history-excerpt, .history-raw { margin: 0; color: #e5d9c5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .history-excerpt { max-height: 8.6em; overflow: hidden; }
    .history-floor.is-expanded .history-excerpt { display: none; }
    .history-raw { display: none; }
    .history-floor.is-expanded .history-raw { display: block; }
    .history-thumbnail { display: none; margin: 7px 12px 0; }
    .history-thumbnail.is-visible { display: block; }
    .history-thumbnail img { display: block; width: min(220px, 52vw); max-height: 132px; object-fit: cover; border: 1px solid rgba(186, 146, 78, .28); }
    .history-actions { display: flex; flex-wrap: wrap; gap: 7px; padding: 10px 12px 12px; }
    .history-action {
      min-width: 44px; min-height: 44px; padding: 7px 12px; cursor: pointer;
      border: 1px solid rgba(197, 158, 87, .42); border-radius: 3px;
      background: rgba(46, 27, 55, .76); color: #eadfc9; font: 650 12px/1.3 ui-sans-serif, sans-serif;
    }
    .history-action.primary { margin-left: auto; border-color: rgba(226, 184, 94, .7); background: #5d294f; color: #fff3df; }
    .history-action:hover, .history-action:focus-visible { border-color: #e0b968; outline: 2px solid transparent; background: #71345f; }
    .history-action:disabled { cursor: wait; opacity: .58; }
    .history-note { display: none; margin: 0 12px 12px; color: #d7989a; font: 12px/1.6 ui-sans-serif, sans-serif; }
    .history-note.is-visible { display: block; }
    @media (max-width: 420px) {
      body { padding-inline: 3px; }
      .history-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .history-action.primary { grid-column: 1 / -1; margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <article class="history-floor" data-mgq-history-floor aria-label="MGQ 历史消息">
    <header class="history-head">
      <p id="history-kicker" class="history-kicker">MGQ · FLOOR</p>
      <span id="history-state" class="history-state">读取中</span>
    </header>
    <div id="history-summary" class="history-summary" aria-label="本楼状态摘要"></div>
    <div class="history-copy">
      <p id="history-excerpt" class="history-excerpt"></p>
      <p id="history-raw" class="history-raw"></p>
    </div>
    <figure id="history-thumbnail" class="history-thumbnail">
      <img id="history-image" alt="本楼场景缩略图" loading="lazy">
    </figure>
    <div class="history-actions">
      <button id="history-expand" class="history-action" type="button">展开原文</button>
      <button id="history-inspect" class="history-action" type="button">查看本楼快照</button>
      <button id="history-continue" class="history-action primary" type="button">继续游戏</button>
    </div>
    <p id="history-note" class="history-note" role="status"></p>
  </article>

  <script>

 * host facade and the generated production message loader. DOM, Tauri and
 * release-loading behavior remains in their adapters.

  const cleanText = value => typeof value === 'string' ? value.trim() : '';
  const createState = () => ({
    sessionId: '',
    chatKey: '',
    epoch: 0,
    inboundSeq: 0,
    outboundSeq: 0,
    phase: 'Dormant',
    mode: null,
    lastComplete: null,
    pending: null,
    highestFloor: -1,
  });
  if (!options || typeof options !== 'object') throw new Error('runtime core options are required');
  const protocol = cleanText(options.protocol);
  const presentationProtocol = cleanText(options.presentationProtocol);

  const state = options.state || createState();
  if (!protocol || !presentationProtocol || typeof normalizePresentation !== 'function') {
    throw new Error('runtime core protocol and normalizer are required');
  }

  function startSession(input) {
    const chatKey = cleanText(input?.chatKey);
    const sessionId = cleanText(input?.sessionId);
    const epoch = Number(input?.epoch);
    const mode = input?.mode === 'native' ? 'native' : 'pseudo';
    if (!chatKey || !sessionId || !Number.isInteger(epoch) || epoch < 0) {
      throw new Error('runtime core session identity is invalid');
    }
    state.sessionId = sessionId;
    state.chatKey = chatKey;
    state.epoch = epoch;
    state.mode = mode;
    state.phase = mode === 'native' ? 'ActiveNative' : 'ActivePseudo';
    state.inboundSeq = 0;
    state.outboundSeq = 0;
    clearPresentations();
    return snapshot();
  }

  function setMode(mode) {
    if (mode !== 'pseudo' && mode !== 'native') return false;
    state.mode = mode;
    state.phase = mode === 'native' ? 'ActiveNative' : 'ActivePseudo';
    return true;
  }

  function advanceEpoch() {
    state.epoch += 1;
    return state.epoch;
  }

  function setPhase(phase) {
    if (!['Dormant', 'Booting', 'ActivePseudo', 'ActiveNative'].includes(phase)) return false;
    state.phase = phase;
    if (phase === 'ActivePseudo') state.mode = 'pseudo';
    else if (phase === 'ActiveNative') state.mode = 'native';
    else if (phase === 'Dormant') state.mode = null;
    return true;
  }

  function present(value) {
    if (!isActive() || !state.sessionId) return null;
    let presentation;
    try { presentation = normalizePresentation(value); } catch (_) { return null; }
    if (!presentation || presentation.protocol !== presentationProtocol) return null;
    if (cleanText(presentation.chatKey) !== state.chatKey) return null;
    const floorIndex = Number(presentation.floorIndex);
    const generation = presentation.generation;
    const signature = cleanText(presentation.presentationSignature);
    const allowFloorRollback = presentation.reason === 'message-deleted';
    if (!Number.isInteger(floorIndex) || floorIndex < 0 || !signature) return null;

    if (floorIndex < state.highestFloor && !allowFloorRollback) return null;

      && target?.presentationSignature === signature
      && target?.generation === generation) return null;

      ? floorIndex
      : Math.max(state.highestFloor, floorIndex);

    else {
      state.lastComplete = presentation;
      state.pending = null;
    }

      type: generation === 'pending' ? 'PRESENTATION_PENDING' : 'PRESENTATION_COMPLETE',
      presentation,
    };

  function createEnvelope(type, payload) {
    if (!state.sessionId || !state.chatKey) return null;
    state.outboundSeq += 1;
    return {
      protocol,
      sessionId: state.sessionId,
      epoch: state.epoch,
      seq: state.outboundSeq,
      chatKey: state.chatKey,
      type: cleanText(type),
      payload,
    };
  }

  function acceptInbound(event, input = {}) {
    if (!isActive() || !state.sessionId) return null;
    if (typeof input.validateSource === 'function' && !input.validateSource(event)) return null;
    const packet = event?.data;
    if (!packet || typeof packet !== 'object' || Array.isArray(packet)) return null;
    if (packet.protocol !== protocol
      || packet.sessionId !== state.sessionId
      || !Number.isInteger(packet.epoch)
      || packet.epoch !== state.epoch
      || packet.chatKey !== state.chatKey) return null;
    if (!Number.isInteger(packet.seq) || packet.seq <= state.inboundSeq) return null;
    if (typeof packet.type !== 'string' || !packet.type || packet.type !== packet.type.trim()) return null;
    const allowedTypes = input.allowedTypes instanceof Set
      ? input.allowedTypes
      : new Set(Array.isArray(input.allowedTypes) ? input.allowedTypes : []);

  function clearPresentations() {
    state.lastComplete = null;
    state.pending = null;
    state.highestFloor = -1;

  function endSession(input = {}) {

    state.mode = null;
    state.inboundSeq = 0;
    state.outboundSeq = 0;
    return snapshot();
  }

  function snapshot() {
    return {
      runtimeCore: runtimeCoreId,
      protocol,
      phase: state.phase,
      mode: state.mode,
      sessionId: state.sessionId,
      epoch: state.epoch,
      chatKey: state.chatKey,
      lastComplete: state.lastComplete,
      pending: state.pending,

  }

    id: runtimeCoreId,
    state,
    startSession,
    setMode,
    advanceEpoch,

    const MANIFEST_URLS = [
      'https://ddfffss.github.io/mgq-v4-frontend/release-manifest.json',
      'https://cdn.jsdelivr.net/gh/ddfffss/mgq-v4-frontend@main/release-manifest.json',
      'https://testingcf.jsdelivr.net/gh/ddfffss/mgq-v4-frontend@main/release-manifest.json',
      'https://raw.githubusercontent.com/ddfffss/mgq-v4-frontend/main/release-manifest.json',
    ];
    const CARD_RELEASE_LOCK = globalThis.__MGQ_CARD_RELEASE_LOCK__
      && typeof globalThis.__MGQ_CARD_RELEASE_LOCK__ === 'object'
      && !Array.isArray(globalThis.__MGQ_CARD_RELEASE_LOCK__)
      ? globalThis.__MGQ_CARD_RELEASE_LOCK__
      : null;
    const floor = document.querySelector('[data-mgq-history-floor]');
    const kicker = document.getElementById('history-kicker');
    const state = document.getElementById('history-state');
    const summary = document.getElementById('history-summary');
    const excerpt = document.getElementById('history-excerpt');
    const raw = document.getElementById('history-raw');
    const thumbnail = document.getElementById('history-thumbnail');
    const image = document.getElementById('history-image');
    const expand = document.getElementById('history-expand');
    const inspect = document.getElementById('history-inspect');
    const continueButton = document.getElementById('history-continue');
    const note = document.getElementById('history-note');
    let messageContext = null;

    function parentWindow() {
      try {
        if (globalThis.parent && globalThis.parent !== globalThis && globalThis.parent.document) {
          void globalThis.parent.document.documentElement;
          return globalThis.parent;
        }
      } catch (_) {}
      return null;
    }

    function getStContext() {
      const owner = parentWindow() || globalThis;
      const st = owner.SillyTavern || globalThis.SillyTavern;
      try { return typeof st?.getContext === 'function' ? st.getContext.call(st) || {} : {}; } catch (_) { return {}; }
    }

    function getContextChat() {
      const chat = getStContext().chat;
      return Array.isArray(chat) ? chat : [];
    }

    function firstIdentity(values) {
      for (const value of values) {
        if (value !== null && value !== undefined && String(value).trim()) return String(value).trim();
      }
      return '';
    }

    function currentChatId() {
      const context = getStContext();
      const chatId = firstIdentity([context.chatId, context.chat_id, context.selectedChat, context.selected_chat]);
      const characterId = firstIdentity([context.characterId, context.character_id, context.this_chid]);
      return chatId && characterId ? characterId + '::' + chatId : chatId || characterId || 'unknown-chat';
    }

    function getRecordMessageIds(record, fallbackIndex) {
      const ids = [];
      for (const candidate of [record?.mesid, record?.id, fallbackIndex, record?.message_id]) {
        if (candidate === null || candidate === undefined || candidate === '') continue;
        const value = Number(candidate);
        if (Number.isInteger(value) && value >= 0 && !ids.includes(value)) ids.push(value);
      }
      return ids;
    }

    function getContextChatEntry(messageId) {
      const chat = getContextChat();
      const target = Number(messageId);
      for (const field of ['mesid', 'id']) {
        const index = chat.findIndex((item) => {
          const value = item?.[field];
          return value !== null && value !== undefined && value !== '' && Number(value) === target;
        });
        if (index >= 0) return { record: chat[index], index };
      }
      if (Number.isInteger(target) && target >= 0 && chat[target]) return { record: chat[target], index: target };
      const legacyIndex = chat.findIndex((item) => {
        const value = item?.message_id;
        return value !== null && value !== undefined && value !== '' && Number(value) === target;
      });
      return legacyIndex >= 0 ? { record: chat[legacyIndex], index: legacyIndex } : undefined;
    }

    function createPresentationSignature(text) {
      const visible = normalizePresentationSource(String(text || ''));
      let hash = 0x811c9dc5;
      for (let index = 0; index < visible.length; index += 1) {
        hash ^= visible.charCodeAt(index);
        hash = Math.imul(hash, 0x01000193) >>> 0;
      }
      return 'v1:' + hash.toString(16).padStart(8, '0') + ':' + visible.length;

    function normalizePresentationSource(rawText) {
      const normalizeWhitespace = value => String(value || '')
        .replace(/\r\n?/g, '\n')
        .replace(/[ \t]+\n/g, '\n')
        .trim();
      const envelopeMatches = rawText.match(/<MGQ_MESSAGE\b[^>]*>[\s\S]*?<\/MGQ_MESSAGE>/gi);
      if (envelopeMatches?.length) {
        return normalizeWhitespace(envelopeMatches[envelopeMatches.length - 1] || '');
      }
      const withoutRuntimeSidecars = rawText
        .replace(/<(?:UpdateVariable|VariableCheck|thinking|draft_notes|meow_FM)\b[^>]*>[\s\S]*?<\/(?:UpdateVariable|VariableCheck|thinking|draft_notes|meow_FM)>/gi, '')
        .replace(/<StatusPlaceHolderImpl\s*\/?>/gi, '')
        .trim();
      try {
        const parsed = JSON.parse(withoutRuntimeSidecars);
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)
          && Object.prototype.hasOwnProperty.call(parsed, '_mgq_runtime')) {
          const visible = { ...parsed };
          delete visible._mgq_runtime;
          return normalizeWhitespace(JSON.stringify(visible));

      return normalizeWhitespace(withoutRuntimeSidecars);

    async function buildMessageContext() {
      const ownIdReader = globalThis.getCurrentMessageId;
      const parentIdReader = parentWindow()?.getCurrentMessageId;
      const reader = typeof ownIdReader === 'function' ? ownIdReader : parentIdReader;
      if (typeof reader !== 'function') throw new Error('当前楼层 ID 不可用');
      const messageId = Number(reader());
      if (!Number.isInteger(messageId) || messageId < 0) throw new Error('当前楼层 ID 无效');
      const entry = getContextChatEntry(messageId);
      let record = entry?.record;
      if (!record) {
        const helper = globalThis.getChatMessages || parentWindow()?.getChatMessages;
        if (typeof helper === 'function') {
          const value = await Promise.resolve(helper(messageId));
          record = Array.isArray(value) ? value[0] : value;
        }
      }
      const rawText = String(record?.mes ?? record?.message ?? '');
      const floorIndex = Number.isInteger(entry?.index) ? entry.index : messageId;
      return Object.freeze({
        kind: 'message',
        messageId,
        chatId: currentChatId(),
        floorIndex,
        idCandidates: getRecordMessageIds(record, floorIndex),
        presentationSignature: createPresentationSignature(rawText),
        rawText,
        isLatest: isLatestAssistantFloor(floorIndex),
      });
    }

    function isLatestAssistantFloor(floorIndex) {
      const chat = getContextChat();
      for (let index = chat.length - 1; index >= 0; index -= 1) {
        const item = chat[index];
        if (item && item.is_user !== true && item.is_system !== true && item.role !== 'user' && item.role !== 'system') {
          return index === floorIndex;
        }
      }
      return false;
    }

    const JSON_ALPHA_STORY_KEYS = new Set([
      '叙事推进', '情节推进', '场景描写', '动作描写', '心理描写', '内心独白',
      '对话推进', '对话', '独白', '场景转换', '结尾钩子', '正文', '正文内容',
      '文本', 'maintext', 'content', 'body', 'narrative',
    ]);

    function parseJsonObjectText(text) {
      let source = String(text || '')
        .replace(/^\s*```(?:json)?\s*/i, '')
        .replace(/\s*```\s*$/i, '')
        .replace(/<StatusPlaceHolderImpl\s*\/?>/gi, '')
        .trim();
      if (source.startsWith('<![CDATA[') && source.endsWith(']]>')) source = source.slice(9, -3).trim();
      const start = source.indexOf('{');
      const end = source.lastIndexOf('}');
      if (start < 0 || end <= start) return null;
      try {
        const value = JSON.parse(source.slice(start, end + 1));
        return value && typeof value === 'object' && !Array.isArray(value) ? value : null;
      } catch (_) {

      }
    }

    function parseDsv4Payload(text) {
      const value = parseJsonObjectText(text);
      if (!value) return null;
      const writing = value.writing;
      return value.format === 'mgq_v4_message'
        || (writing && typeof writing === 'object' && !Array.isArray(writing))
        ? value
        : null;
    }

    function cleanHistoryText(text) {
      return String(text || '')
        .replace(/<status_data\b[^>]*>[\s\S]*?<\/status_data>/gi, '')
        .replace(/<UpdateVariable\b[^>]*>[\s\S]*?<\/UpdateVariable>/gi, '')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        .replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    }

    function collectAlphaStory(value, fields) {
      if (typeof value === 'string') {
        if (value.trim()) fields.push(value.trim());
        return;
      }
      if (Array.isArray(value)) {
        for (const item of value) collectAlphaStory(item, fields);
        return;

      if (!value || typeof value !== 'object') return;
      for (const [key, item] of Object.entries(value)) {

      if (typeof value === 'string' || typeof value === 'number') return String(value).trim();
      if (!value || typeof value !== 'object' || Array.isArray(value)) return '';

        ? ['name', 'display_name', 'displayName', 'actor_name', '角色名']
        : ['title', 'name', 'label', 'text', 'objective', 'description', '目标'];
      for (const key of keys) {
        const candidate = value[key];
        if (typeof candidate === 'string' || typeof candidate === 'number') {
          const text = String(candidate).trim();
          if (text) return text;
        }
      }
      return '';
    }

    function summarizeStatusObject(status) {
      if (!status || typeof status !== 'object' || Array.isArray(status)) return [];
      const values = [];
      for (const keys of [['time', '时间'], ['location', '地点'], ['chapter', '章节']]) {
        const value = keys.map(key => status[key]).find(item => item !== null && item !== undefined);
        const text = statusValueText(value);
        if (text) values.push(text);
      }
      const objectives = status.objectives ?? status.objective ?? status['目标'];
      for (const item of Array.isArray(objectives) ? objectives : [objectives]) {
        const text = statusValueText(item);
        if (text) values.push(text);
      }
      const actors = status.actors ?? status['角色'];
      for (const item of Array.isArray(actors) ? actors : [actors]) {
        const text = statusValueText(item, true);
        if (text) values.push(text);

    function statusSummary(text) {
      const source = String(text || '');
      const dsv4 = parseDsv4Payload(source);
      if (dsv4?.status_data && typeof dsv4.status_data === 'object') {
        return summarizeStatusObject(dsv4.status_data);

      const jsonStatus = parseJsonObjectText(block);
      if (jsonStatus) return summarizeStatusObject(jsonStatus);

      const values = [];
      for (const tag of ['time', 'location', 'chapter', 'objective']) {
        const value = block.match(new RegExp('<' + tag + '\\b[^>]*>([\\s\\S]*?)<\\/' + tag + '>', 'i'))?.[1];
        if (value) values.push(value.replace(/<[^>]+>/g, ' ').trim());
      }
      for (const match of block.matchAll(/<actor\b[^>]*(?:name|display_name)=["']([^"']+)["'][^>]*>/gi)) values.push(match[1]);
      return [...new Set(values.filter(Boolean))].slice(0, 6);
    }

    function thumbnailUrl(text) {
      const value = String(text || '').match(/https?:\/\/[^\s"'<>]+\.(?:png|jpe?g|webp|gif)(?:\?[^\s"'<>]*)?/i)?.[0];
      return value || '';
    }

    function renderHistory(context) {
      kicker.textContent = 'MGQ · FLOOR ' + context.floorIndex;
      state.textContent = context.isLatest ? '当前楼层' : '历史只读';
      const story = visibleStory(context.rawText) || '本楼正文为空。';
      excerpt.textContent = story;
      // The expanded history surface is still a display-only snapshot. Never
      // expose controller sidecars or raw status/update payloads here.
      raw.textContent = story;
      summary.replaceChildren(...statusSummary(context.rawText).map(value => {
        const chip = document.createElement('span');
        chip.className = 'history-chip';
        chip.textContent = value;
        return chip;
      }));
      const url = thumbnailUrl(context.rawText);
      if (url) {
        image.src = url;
        thumbnail.classList.add('is-visible');
      }
      announceHeight();
    }

    function showNote(message) {
      note.textContent = String(message || '');
      note.classList.toggle('is-visible', Boolean(message));
      announceHeight();
    }

    function announceHeight() {
      const height = Math.max(1, Math.ceil(document.documentElement.getBoundingClientRect().height));
      try {
        const frame = globalThis.frameElement;
        if (frame?.style) frame.style.height = height + 'px';
      } catch (_) {}
      try {
        globalThis.parent?.postMessage({
          type: 'MGQ_HISTORY_HEIGHT',
          messageId: messageContext?.messageId ?? null,
          height,
        }, '*');
      } catch (_) {}
    }

    async function ensureParentHost() {
      const owner = parentWindow();
      if (!owner) throw new Error('当前 TT 不允许访问父页面，已进入历史只读兼容模式。');
      const existing = owner[HOST_KEY];
      if (existing?.protocol === IMMERSIVE_PROTOCOL
        && existing?.implementationRevision === HOST_IMPLEMENTATION_REVISION
        && typeof existing.enter === 'function') return existing;
      if (existing && typeof existing.destroy === 'function') await existing.destroy('version-replaced');

      const requestId = 'mgq-host-install-' + Math.random().toString(36).slice(2);
      const target = owner.document.head || owner.document.body || owner.document.documentElement;
      if (!target) throw new Error('父页面尚未就绪');
      await new Promise((resolve, reject) => {
        let settled = false;
        const timeout = owner.setTimeout(() => finish(false, '安装沉浸宿主超时'), 8000);
        const onReady = event => {
          if (event?.detail?.requestId !== requestId) return;
          finish(Boolean(event.detail.ok), event.detail.error);
        };
        const finish = (ok, error) => {
          if (settled) return;
          settled = true;
          owner.clearTimeout(timeout);
          owner.removeEventListener(HOST_READY_EVENT, onReady);
          script.remove();
          ok ? resolve() : reject(new Error(error || '沉浸宿主安装失败'));
        };
        owner.addEventListener(HOST_READY_EVENT, onReady);
        const script = owner.document.createElement('script');
        script.textContent = '(' + parentHostInstaller.toString() + ')(' + JSON.stringify({
          requestId,
          hostKey: HOST_KEY,
          readyEvent: HOST_READY_EVENT,
          immersiveProtocol: IMMERSIVE_PROTOCOL,
          presentationProtocol: PRESENTATION_PROTOCOL,
          statusProtocol: STATUS_PROTOCOL,
          publicStateProtocol: PUBLIC_STATE_PROTOCOL,
          manifestProtocol: MANIFEST_PROTOCOL,
          bgmProtocol: BGM_MANIFEST_PROTOCOL,
          implementationRevision: HOST_IMPLEMENTATION_REVISION,
          manifestUrls: MANIFEST_URLS,
          cardReleaseLock: CARD_RELEASE_LOCK,
        }) + ',(' + normalizePresentationSource.toString() + '),('
          + createImmersiveHostRuntimeCore.toString() + '));';
        target.appendChild(script);
      });
      const installed = owner[HOST_KEY];
      if (installed?.protocol !== IMMERSIVE_PROTOCOL) throw new Error('沉浸宿主协议不匹配');
      return installed;
    }

    async function prewarmPersistentHost(context) {
      if (!context?.isLatest) return;
      try {
        const host = await ensureParentHost();
        await host.ensureHost(context.chatId);
      } catch (error) {
        // History remains readable when the parent is not same-origin or the
        // immutable release is unavailable. Surface compatibility now rather
        // than waiting for the player to click Continue.
        state.textContent = '只读兼容';
        showNote(error?.message || '常驻沉浸舞台预创建失败；本楼仍可只读查看。');
      }
    }

    function shouldAutoEnterOpening(context) {
      return Boolean(
        context?.isLatest
        && /\[\s*MGQ_OPENING_UI\s*\]/i.test(String(context?.rawText || '')),
      );
    }

    async function enterPersistentHost(context, preferredMode = 'auto') {
      if (!context) throw new Error('当前楼层尚未就绪');
      const host = await ensureParentHost();
      return host.enter({
        protocol: IMMERSIVE_PROTOCOL,
        chatKey: currentChatId(),
        anchorMessageIds: context.idCandidates,
        preferredMode,
      });
    }

    async function autoEnterOpening(context) {
      state.textContent = '启动界面';
      excerpt.textContent = '正在载入 MGQ 开局界面…';
      continueButton.disabled = true;
      announceHeight();
      try {
        // Automatic startup deliberately begins in pseudo fullscreen. Native
        // fullscreen still requires a real user gesture on several TT engines.
        await enterPersistentHost(context, 'pseudo');
      } catch (error) {
        state.textContent = '启动失败';
        showNote('opening-bootstrap-failed：' + (error?.message || '沉浸舞台启动失败'));
      } finally {
        continueButton.disabled = false;
      }
    }

    function parentHostInstaller(config, normalizePresentationSource, createImmersiveHostRuntimeCoreSource) {
      const notify = (ok, error) => window.dispatchEvent(new CustomEvent(config.readyEvent, {
        detail: { requestId: config.requestId, ok, error: error ? String(error) : '' },
      }));
      try {
        if (typeof normalizePresentationSource !== 'function') {
          throw new Error('presentation normalizer is unavailable');
        }
        if (typeof createImmersiveHostRuntimeCoreSource !== 'function') {
          throw new Error('shared immersive runtime core is unavailable');
        }
        const old = window[config.hostKey];
        if (old?.protocol === config.immersiveProtocol
          && old?.implementationRevision === config.implementationRevision
          && typeof old.enter === 'function') {
          notify(true);
          return;
        }

        const releaseByChat = new Map();
        const cleanups = [];
        let frame = null;
        let port = null;
        let hostSource = null;
        let sessionId = '';
        let chatKey = '';
        let epoch = 0;
        let outboundSeq = 0;
        let inboundSeq = 0;
        let phase = 'Dormant';
        let mode = null;
        let lastComplete = null;
        let pending = null;
        let highestFloor = -1;
        let previousHtmlOverflow = '';
        let previousBodyOverflow = '';
        let activeRelease = null;
        let bootPromise = null;
        let bootCancel = null;
        let bootRevision = -1;
        let abortController = new AbortController();
        let compatibilityReason = '';
        let enterQueue = Promise.resolve();
        let openingSession = false;
        let openingAnchor = null;
        let recoveryUsed = false;
        let recovering = false;
        let terminalHostError = '';
        let historyGuardArmed = false;
        let historyGuardToken = '';
        let ignoredGuardPops = 0;
        let destroyed = false;
        let lifecycleRevision = 0;
        let chatLifecycleRevision = 0;
        const handledActionRequestIds = new Set();
        const guardedLegacyDocuments = new WeakSet();
        const legacyAudioObservers = new Set();
        const runtimeCore = createImmersiveHostRuntimeCoreSource({
          protocol: config.immersiveProtocol,
          presentationProtocol: config.presentationProtocol,
          normalizePresentation: normalizePresentationValue,
          state: {
            get sessionId() { return sessionId; },
            set sessionId(value) { sessionId = value; },
            get chatKey() { return chatKey; },
            set chatKey(value) { chatKey = value; },
            get epoch() { return epoch; },
            set epoch(value) { epoch = value; },
            get outboundSeq() { return outboundSeq; },
            set outboundSeq(value) { outboundSeq = value; },
            get inboundSeq() { return inboundSeq; },
            set inboundSeq(value) { inboundSeq = value; },
            get phase() { return phase; },
            set phase(value) { phase = value; },
            get mode() { return mode; },
            set mode(value) { mode = value; },
            get lastComplete() { return lastComplete; },
            set lastComplete(value) { lastComplete = value; },
            get pending() { return pending; },
            set pending(value) { pending = value; },
            get highestFloor() { return highestFloor; },
            set highestFloor(value) { highestFloor = value; },
          },
        });

        const api = {
          protocol: config.immersiveProtocol,
          implementationRevision: config.implementationRevision,
          presentationProtocol: config.presentationProtocol,
          statusProtocol: config.statusProtocol,
          ensureHost,
          enter,
          exit,
          present,
          getState,
          destroy,
          handleChatChanged,
        };
        window[config.hostKey] = api;
        installChatLifecycle();
        suppressLegacyParentAudio();
        installLegacyAudioGuard();
        notify(true);

        const requiredReleaseFiles = Object.freeze([
          'opening.html',
          'message-loader.html',
          'mgq-v4.js',
          'mgq-v4.css',
        ]);

        async function resolveRelease(key) {
          if (releaseByChat.has(key)) return releaseByChat.get(key);
          // A supplied-but-invalid pin is a broken/tampered card.  Do not hide
          // that by silently loading whatever happens to be on main.
          const cardPin = config.cardReleaseLock === null || config.cardReleaseLock === undefined
            ? null
            : normalizeRelease(config.cardReleaseLock, 'card-pin', []);
          const selected = await resolveCompatibleManifestOrPin(cardPin);
          releaseByChat.set(key, selected);
          return selected;
        }

        async function resolveCompatibleManifestOrPin(cardPin) {
          let lastError = null;
          for (const url of config.manifestUrls) {
            try {
              const response = await fetch(url, { cache: 'no-cache', signal: abortController.signal });
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const manifest = await response.json();
              if (cardPin && manifest.card_version !== cardPin.cardVersion) {
                throw new Error('root manifest 与卡片版本不同');
              }
              return normalizeRelease(manifest, url, config.manifestUrls);
            } catch (error) {
              if (error?.name === 'AbortError') throw error;
              lastError = error;
            }
          }
          if (cardPin) return cardPin;
          throw new Error('无法解析兼容的正式前端版本：' + (lastError?.message || lastError || 'unknown'));
        }

        function normalizeRelease(manifest, source, fallbackRoots) {
          if (!manifest || typeof manifest !== 'object' || Array.isArray(manifest)) {
            throw new Error('release manifest 不是对象');
          }
          if (manifest.schema !== config.manifestProtocol) throw new Error('release manifest 协议不匹配');
          if (manifest.immersive_protocol !== config.immersiveProtocol) throw new Error('沉浸协议不兼容');
          if (manifest.presentation_protocol !== config.presentationProtocol) throw new Error('场景协议不兼容');
          if (manifest.status_protocol !== config.statusProtocol) throw new Error('状态协议不兼容');
          const cardVersion = String(manifest.card_version || '').trim();
          const buildId = String(manifest.build_id || '').trim();
          const sourceCommit = String(manifest.source_commit || '').trim();
          const basePath = String(manifest.base_path || '').trim().replace(/\/?$/, '/');
          if (!cardVersion || !buildId || !sourceCommit || !basePath) {
            throw new Error('release manifest 缺少 card_version/build_id/source_commit/base_path');
          }
          if (!/^[A-Za-z0-9][A-Za-z0-9._-]{5,127}$/.test(buildId)) {
            throw new Error('release manifest build_id 格式非法');
          }
          if (!/^[0-9a-f]{40}$/i.test(sourceCommit)) {
            throw new Error('release manifest source_commit 必须是 40 位十六进制提交');
          }
          const files = manifest.files;
          if (!files || typeof files !== 'object' || Array.isArray(files)) throw new Error('release manifest 缺少 files');
          const bgmProtocol = String(manifest.bgm_protocol || '').trim();
          const bgmBasePath = String(manifest.bgm_base_path || '').trim();
          if (bgmProtocol !== config.bgmProtocol) {
            throw new Error('BGM manifest 协议不兼容');
          }
          if (bgmBasePath !== 'bgm/') {
            throw new Error('BGM base_path 必须是不可变 release 内的 bgm/');
          }
          const normalizedFiles = {};
          const pinnedReleaseFiles = [...requiredReleaseFiles, 'bgm-manifest.json'];
          for (const file of pinnedReleaseFiles) {
            if (!Object.prototype.hasOwnProperty.call(files, file) || !files[file]) {
              throw new Error('release manifest 缺少 ' + file);
            }
            const metadata = files[file];
            if (!metadata || typeof metadata !== 'object' || Array.isArray(metadata)) {
              throw new Error('release manifest ' + file + ' 元数据非法');
            }
            if (!/^[0-9a-f]{64}$/i.test(String(metadata.sha256 || ''))) {
              throw new Error('release manifest ' + file + ' sha256 非法');
            }
            const size = Number(metadata.size);
            if (!Number.isSafeInteger(size) || size <= 0) {
              throw new Error('release manifest ' + file + ' size 非法');
            }
            normalizedFiles[file] = Object.freeze({
              sha256: String(metadata.sha256).toLowerCase(),
              size,
            });
          }
          const roots = [];
          const addRoot = value => {
            const root = String(value || '').trim();
            if (!/^https:\/\//i.test(root)) return;
            try {
              const normalized = new URL(root);
              normalized.hash = '';
              normalized.search = '';
              if (!normalized.pathname.endsWith('/')) normalized.pathname += '/';
              if (!roots.includes(normalized.href)) roots.push(normalized.href);
            } catch (_) {}
          };
          for (const value of Array.isArray(manifest.base_urls) ? manifest.base_urls : []) addRoot(value);
          if (manifest.channels && typeof manifest.channels === 'object') {
            for (const value of Object.values(manifest.channels)) addRoot(value);
          }
          for (const value of Array.isArray(fallbackRoots) ? fallbackRoots : []) {
            try { addRoot(new URL('.', value).href); } catch (_) {}
          }
          if (/^https:\/\//i.test(basePath)) addRoot(basePath);
          const baseUrls = [];
          const resolvedBasePath = /^https:\/\//i.test(basePath) ? basePath : basePath.replace(/^\/+/, '');
          for (const root of roots) {
            try {
              const resolved = new URL(resolvedBasePath, root).href.replace(/\/?$/, '/');
              const path = decodeURIComponent(new URL(resolved).pathname);
              if (!path.includes('/releases/') || !path.includes('/' + cardVersion + '/' + buildId + '/')) {
                throw new Error('release base_path 不是不可变目录');
              }
              if (!baseUrls.includes(resolved)) baseUrls.push(resolved);
            } catch (error) {
              if (String(error?.message || error).includes('不是不可变目录')) throw error;
            }
          }
          if (!baseUrls.length) throw new Error('release manifest 没有可用的不可变 base URL');
          const bgmBaseUrls = baseUrls.map(
            base => new URL(bgmBasePath, base).href.replace(/\/?$/, '/'),
          );
          return Object.freeze({
            buildId,
            cardVersion,
            sourceCommit,
            baseUrl: baseUrls[0],
            baseUrls: Object.freeze(baseUrls),
            bgmProtocol,
            bgmBasePath,
            bgmBaseUrls: Object.freeze(bgmBaseUrls),
            files: Object.freeze(normalizedFiles),
            manifestUrl: source,
          });
        }

        async function ensureHost(requestedChatKey, expectedRevision = lifecycleRevision) {
          assertLifecycle(expectedRevision);
          const key = String(requestedChatKey || chatKey || readChatKey()).trim();
          if (!key) throw new Error('chatKey 不能为空');
          const release = await resolveRelease(key);
          assertLifecycle(expectedRevision);
          if (frame && activeRelease?.buildId !== release.buildId) resetFrame();
          activeRelease = release;
          if (frame?.isConnected && port) return capabilities();
          if (bootPromise && bootRevision === expectedRevision) return bootPromise;
          if (bootPromise) resetFrame('host-boot-superseded');
          phase = 'Booting';
          const candidate = document.createElement('iframe');
          frame = candidate;
          candidate.dataset.mgqImmersiveHost = 'v1';
          candidate.dataset.ttMobileSurface = 'viewport-host';
          candidate.dataset.mgqBuildId = release.buildId;
          candidate.title = 'MGQ 沉浸游戏舞台';
          candidate.allow = 'fullscreen; autoplay';
          candidate.setAttribute('allowfullscreen', '');
          candidate.style.cssText = 'position:fixed;inset:0;width:100%;height:var(--tt-base-viewport-height,100dvh);border:0;background:#07050d;z-index:2147483000;display:none;';
          candidate.srcdoc = createHostDocument(release);
          let settled = false;
          let resolveBoot;
          let rejectBoot;
          const promise = new Promise((resolve, reject) => {
            resolveBoot = resolve;
            rejectBoot = reject;
          });
          const finish = (error, value) => {
            if (settled) return;
            settled = true;
            if (bootPromise === promise) {
              bootPromise = null;
              bootCancel = null;
              bootRevision = -1;
            }
            if (error) {
              try { candidate.remove?.(); } catch (_) {}
              if (frame === candidate) frame = null;
              rejectBoot(error);
            } else {
              resolveBoot(value);
            }
          };
          bootPromise = promise;
          bootRevision = expectedRevision;
          bootCancel = reason => finish(lifecycleError(reason || 'host-boot-cancelled'));
          candidate.addEventListener('error', () => {
            if (sessionId && isLifecycleCurrent(expectedRevision)) {
              void recoverHostOnce('host-frame-error');
            }
            finish(new Error('host-frame-load-failed'));
          }, { once: true });
          candidate.addEventListener('load', () => {
            try {
              assertLifecycle(expectedRevision);
              if (frame !== candidate || !candidate.isConnected) throw lifecycleError('host-frame-replaced');
              const channel = new MessageChannel();
              port = channel.port1;
              hostSource = candidate.contentWindow;
              port.onmessage = onHostPacket;
              port.start?.();
              candidate.contentWindow.postMessage({ protocol: config.immersiveProtocol, type: 'MGQ_HOST_CONNECT' }, '*', [channel.port2]);
              phase = 'Dormant';
              finish(null, capabilities());
            } catch (error) {
              closeTransport();
              if (isLifecycleCurrent(expectedRevision)) phase = 'Dormant';
              finish(error);
            }
          }, { once: true });
          document.body.appendChild(candidate);
          return promise;
        }

        function enter(request) {
          if (destroyed) return Promise.reject(lifecycleError('host-destroyed'));
          const ticket = Object.freeze({
            chatLifecycleRevision,
            chatKey: String(request?.chatKey || '').trim(),
          });
          const runEnter = () => enterSession(request, ticket);
          const run = enterQueue.then(runEnter, runEnter);
          enterQueue = run.catch(() => {});
          return run;
        }

        async function enterSession(request, ticket) {
          if (ticket?.chatLifecycleRevision !== chatLifecycleRevision) {
            throw lifecycleError('chat-changed-before-enter');
          }
          const operationRevision = ++lifecycleRevision;
          assertLifecycle(operationRevision);
          if (request?.protocol !== config.immersiveProtocol) throw new Error('沉浸协议不匹配');
          const nextChat = String(request.chatKey || '').trim();
          if (!nextChat) throw new Error('chatKey 不能为空');
          if (ticket?.chatKey !== nextChat) throw lifecycleError('enter-request-mutated');
          assertLiveChatBinding(nextChat);
          if (chatKey && chatKey !== nextChat) {
            await handleChatChanged(nextChat, operationRevision);
            assertLifecycle(operationRevision);
            assertLiveChatBinding(nextChat);
          }
          const sameChatReentry = Boolean(sessionId && chatKey === nextChat);
          const latest = readLatestAssistant();
          const initialPresentation = await readControllerPresentation(latest, 'character-message-rendered');
          assertLifecycle(operationRevision);
          assertLiveChatBinding(nextChat);
          const opening = Boolean(latest && isOpeningMarker(latest.rawText));
          if (!initialPresentation && !opening) {
            compatibilityReason = 'controller-unavailable-read-only';
            throw new Error('controller-unavailable-read-only：运行控制器未提供原子场景，本楼仍可只读查看；请使用新版角色卡新建聊天。');
          }
          const normalizedInitialPresentation = initialPresentation
            ? normalizePresentationValue(initialPresentation)
            : null;
          if (initialPresentation && !normalizedInitialPresentation) {
            throw new Error('controller-presentation-invalid：运行控制器返回的场景协议无效');
          }
          if (normalizedInitialPresentation && normalizedInitialPresentation.chatKey !== nextChat) {
            throw new Error('controller-chat-binding-mismatch：运行控制器场景不属于当前聊天');
          }
          await ensureHost(nextChat, operationRevision);
          assertLifecycle(operationRevision);
          assertLiveChatBinding(nextChat);
          suppressLegacyParentAudio();
          let transitionStarted = false;
          try {
            transitionStarted = true;
            if (sameChatReentry) {
              runtimeCore.advanceEpoch();
              pauseHostAudio();
              abortController.abort();
              abortController = new AbortController();
              runtimeCore.endSession();
              handledActionRequestIds.clear();
            } else {
              runtimeCore.advanceEpoch();
            }
            runtimeCore.startSession({
              sessionId: crypto?.randomUUID?.() || 'mgq-session-' + Math.random().toString(36).slice(2),
              chatKey: nextChat,
              epoch,
              mode: 'pseudo',
            });
            openingSession = opening;
            openingAnchor = opening ? detachedClone(latest) : null;
            if (openingAnchor) {
              const mapSnapshot = readOpeningMapSnapshot(openingAnchor);
              if (mapSnapshot) openingAnchor.mapSnapshot = mapSnapshot;
            }
            recoveryUsed = false;
            recovering = false;
            terminalHostError = '';
            compatibilityReason = '';
            handledActionRequestIds.clear();
            if (!sameChatReentry) lockScroll();
            armBackGuard();
            frame.style.display = 'block';
            send('SESSION_ENTER', {
              anchorMessageIds: normalizeIds(request.anchorMessageIds),
              mode,
              opening,
              openingBinding: openingAnchor,
            });
            if (openingSession && openingAnchor && !openingAnchor.mapSnapshot) {
              scheduleOpeningMapRefresh(operationRevision, sessionId, epoch);
            }

            const wantsNative = request.preferredMode !== 'pseudo' && !isIos();
            if (wantsNative && typeof frame.requestFullscreen === 'function') {
              const fullscreenFrame = frame;
              try {
                await fullscreenFrame.requestFullscreen();
                if (!isLifecycleCurrent(operationRevision)) {
                  await exitNative(fullscreenFrame);
                  throw lifecycleError('native-fullscreen-superseded');
                }
                runtimeCore.setMode('native');
                send('MODE_CHANGED', { mode });
              } catch (_) {}
            }
            assertLifecycle(operationRevision);
            assertLiveChatBinding(nextChat);
            if (normalizedInitialPresentation && !present(normalizedInitialPresentation)) {
              throw new Error('controller-presentation-rejected：当前场景未被沉浸宿主接受');
            }
            return { sessionId, epoch, mode };
          } catch (error) {
            if (transitionStarted && isLifecycleCurrent(operationRevision)) {
              await deactivate(false, operationRevision);
            }
            throw error;
          }
        }

        async function exit(request) {
          if (request?.sessionId !== sessionId || Number(request?.epoch) !== epoch) return;
          if (!['return-to-tavern', 'android-back-confirmed', 'host-failure'].includes(String(request?.reason || ''))) return;
          await deactivate(true);
        }

        function present(value) {
          if (!sessionId || !port) return false;
          const accepted = runtimeCore.present(value);
          if (!accepted) return false;
          if (accepted.type === 'PRESENTATION_COMPLETE') {
            openingSession = false;
            openingAnchor = null;
          }
          send(accepted.type, accepted.presentation);
          return true;
        }

        function sanitizePublicStateValue(value) {
          const record = candidate => candidate && typeof candidate === 'object' && !Array.isArray(candidate)
            ? candidate : {};
          const cleanText = candidate => ['string', 'number', 'boolean'].includes(typeof candidate)
            ? String(candidate).trim() : '';
          const cleanNumber = candidate => Number.isFinite(Number(candidate)) ? Math.max(0, Number(candidate)) : 0;
          const cleanList = candidate => (Array.isArray(candidate) ? candidate : [])
            .map(cleanText).filter(Boolean);
          const cleanTextMap = candidate => Object.fromEntries(Object.entries(record(candidate))
            .map(([key, item]) => [cleanText(key), cleanText(item)])
            .filter(([key, item]) => key && item));
          if (!value || typeof value !== 'object' || Array.isArray(value)
            || value.protocol !== config.publicStateProtocol) return null;

          const rawMessageId = Number(cloned.messageId ?? cloned.message_id);
          const messageId = Number.isInteger(rawMessageId) && rawMessageId >= 0
            ? rawMessageId
            : (messageIdCandidates[0] ?? floorIndex);
          const statusSnapshotInput = cloned.statusSnapshot ?? cloned.status_snapshot ?? null;
          const statusSnapshot = statusSnapshotInput === null
            ? null
            : sanitizeStatusSnapshotValue(statusSnapshotInput);
          if (statusSnapshotInput !== null && !statusSnapshot) return null;
          if (statusSnapshot && (
            statusSnapshot.presentation_signature !== presentationSignature
            || !messageIdCandidates.includes(statusSnapshot.message_id)
          )) return null;
          const publicStateInput = cloned.publicState ?? cloned.public_state ?? null;
          const publicState = publicStateInput === null ? null : sanitizePublicStateValue(publicStateInput);
          if (publicStateInput !== null && !publicState) return null;
          const challengeInput = cloned.challengeGate ?? cloned.challenge_gate ?? null;
          const challengeGate = challengeInput === null
            ? null
            : sanitizePresentationChallenge(challengeInput, floorIndex, presentationSignature);
          if (challengeInput !== null && !challengeGate) return null;
          const reflectionInput = cloned.reflectionGate ?? cloned.reflection_gate ?? null;
          const reflectionGate = reflectionInput === null
            ? null
            : sanitizePresentationReflection(reflectionInput, floorIndex, presentationSignature);
          if (reflectionInput !== null && !reflectionGate) return null;
          const endingInput = cloned.endingProposal ?? cloned.ending_proposal ?? null;
          const endingProposal = endingInput === null
            ? null
            : sanitizePresentationEnding(endingInput, floorIndex, presentationSignature);
          if (endingInput !== null && !endingProposal) return null;

          const body = String(cloned.body ?? cloned.rawText ?? '');
          const rawText = String(cloned.rawText ?? cloned.body ?? '');
          return Object.freeze({
            protocol: config.presentationProtocol,
            chatKey: normalizedChatKey,
            floorIndex,
            messageIdCandidates,
            messageId,
            presentationSignature,
            generation,
            readOnly: generation !== 'complete' || cloned.readOnly === true,
            diagnostics: (Array.isArray(cloned.diagnostics) ? cloned.diagnostics : []).map(item => {
              const input = item && typeof item === 'object' && !Array.isArray(item) ? item : {};
              return {
                code: String(input.code || '').trim(),
                errors: Array.isArray(input.errors) ? input.errors.map(error => String(error || '').trim()).filter(Boolean) : [],
              };
            }),
            body,
            rawText,
            dialogue: sanitizePresentationDialogue(cloned.dialogue ?? cloned.dialogue_lines),
            options: (Array.isArray(cloned.options) ? cloned.options : [])
              .map(item => String(item ?? '').trim()).filter(Boolean),
            stage: sanitizePresentationStage(cloned.stage),
            resources: sanitizePresentationResources(cloned.resources),
            statusSnapshot,
            publicState,
            challengeGate,
            reflectionGate,
            endingProposal,
            battle: sanitizePresentationBattle(cloned.battle),
            ...(cloned.recovered === true ? { recovered: true } : {}),
            ...(String(cloned.reason || '').trim() ? { reason: String(cloned.reason).trim() } : {}),
          });
        }

        function clearPresentation(reason) {
          runtimeCore.clearPresentations();
          openingSession = false;
          openingAnchor = null;
          send('PRESENTATION_CLEARED', { reason: String(reason || 'message-deleted') });
          return true;
        }

        async function handleChatChanged(_nextChatKey, expectedRevision = null) {
          if (!Number.isInteger(expectedRevision)) chatLifecycleRevision += 1;
          const operationRevision = Number.isInteger(expectedRevision)
            ? expectedRevision
            : ++lifecycleRevision;
          if (destroyed || lifecycleRevision !== operationRevision) return;
          runtimeCore.advanceEpoch();
          pauseHostAudio();
          suppressLegacyParentAudio();
          abortController.abort();
          abortController = new AbortController();
          closeTransport();
          const nativeFrame = frame;
          runtimeCore.clearPresentations();
          openingSession = false;
          openingAnchor = null;
          handledActionRequestIds.clear();
          disarmBackGuard();
          unlockScroll();
          resetFrame('chat-changed');
          runtimeCore.endSession();
          await exitNative(nativeFrame);
        }

        async function destroy(_reason) {
          if (destroyed) return;
          destroyed = true;
          const operationRevision = ++lifecycleRevision;
          await deactivate(true, operationRevision);
          while (cleanups.length) {
            try { cleanups.pop()(); } catch (_) {}
          }
          if (window[config.hostKey] === api) delete window[config.hostKey];
        }

        async function deactivate(remove, expectedRevision = null) {
          const operationRevision = Number.isInteger(expectedRevision)
            ? expectedRevision
            : ++lifecycleRevision;
          abortController.abort();
          abortController = new AbortController();
          pauseHostAudio();
          const nativeFrame = frame;
          runtimeCore.clearPresentations();
          openingSession = false;
          openingAnchor = null;
          handledActionRequestIds.clear();
          disarmBackGuard();
          unlockScroll();
          if (frame) frame.style.display = 'none';
          if (remove) resetFrame('host-deactivated');
          runtimeCore.endSession();
          await exitNative(nativeFrame);
        }

        function send(type, payload) {
          if (!port || !sessionId || !chatKey) return;
          const envelope = runtimeCore.createEnvelope(type, payload);
          if (envelope) port.postMessage(envelope);
        }

        function onHostPacket(event) {
          const packet = runtimeCore.acceptInbound(event, {
            validateSource: candidate => Boolean(
              port
              && (!candidate?.target || candidate.target === port)
              && frame?.isConnected
              && frame?.contentWindow === hostSource
            ),
            allowedTypes: [
            'HOST_READY',
            'RETURN_TO_TAVERN_REQUEST',
            'NATIVE_FULLSCREEN_REQUEST',
            'NATIVE_FULLSCREEN_EXITED',
            'PLAYER_SETTING_UPDATE_REQUEST',
            'ACTION_REQUEST',
            'BACK_ACTION_REQUEST',
            'ANDROID_BACK_RESULT',
            'HOST_ERROR',
            ],
          });
          if (!packet) return;
          if (packet.type === 'RETURN_TO_TAVERN_REQUEST') {
            void exit({ sessionId, epoch, reason: 'return-to-tavern' });
          } else if (packet.type === 'NATIVE_FULLSCREEN_REQUEST') {
            void handleNativeFullscreenRequest(packet.payload);
          } else if (packet.type === 'NATIVE_FULLSCREEN_EXITED' && phase === 'ActiveNative') {
            runtimeCore.setMode('pseudo');
          } else if (packet.type === 'PLAYER_SETTING_UPDATE_REQUEST') {
            void handlePlayerSettingUpdate(packet.payload);
          } else if (packet.type === 'ACTION_REQUEST') {
            void handleActionRequest(packet.payload);
          } else if (packet.type === 'BACK_ACTION_REQUEST') {
            void handleBackAction('host-action');
          } else if (packet.type === 'HOST_ERROR') {
            void recoverHostOnce(String(packet.payload?.message || 'host-error'));
          }
        }

        async function handleNativeFullscreenRequest(payload) {
          const requestId = String(payload?.requestId || '');
          let ok = false;
          if (requestId && !isIos() && frame?.isConnected && sessionId) {
            try {
              if (document.fullscreenElement !== frame) await frame.requestFullscreen?.();
              ok = document.fullscreenElement === frame;
            } catch (_) {}
          }
          if (ok) {
            runtimeCore.setMode('native');
          } else if (phase !== 'Dormant') {
            runtimeCore.setMode('pseudo');
          }
          send('NATIVE_FULLSCREEN_RESULT', { requestId, ok, mode });
        }

        function captureResponseTransport() {
          return { port, sessionId, epoch, chatKey };
        }

        function responseTransportIsCurrent(binding) {
          return Boolean(binding?.port && port === binding.port
            && sessionId === binding.sessionId
            && epoch === binding.epoch
            && chatKey === binding.chatKey);
        }

        function sendBoundResponse(binding, type, payload) {
          if (!responseTransportIsCurrent(binding)) return false;
          send(type, payload);
          return true;
        }

        async function handlePlayerSettingUpdate(payload) {
          const responseTransport = captureResponseTransport();
          const requestId = String(payload?.requestId || '');
          try {
            if (!requestId) throw new Error('设置请求 ID 为空');
            const key = String(payload?.key || '');
            const value = String(payload?.value || '');
            if (!isAllowedPlayerSetting(key, value)) throw new Error('不支持的玩家设置');
            const binding = payload?.binding;
            validateLiveBinding(binding, openingSession);
            const controller = readController('updatePlayerSetting');
            const result = await Promise.resolve(controller.updatePlayerSetting({
              chatKey,
              key,
              value,
              floorIndex: Number(binding.floorIndex),
              messageId: normalizeIds(binding.messageIdCandidates)[0],
              messageIdCandidates: normalizeIds(binding.messageIdCandidates),
              presentationSignature: String(binding.presentationSignature || ''),
              hostSessionId: sessionId,
              hostEpoch: epoch,
            }));
            validateLiveBinding(binding, openingSession);
            const publicState = sanitizePublicStateValue(result);
            if (!publicState) throw new Error('设置更新未返回 PublicStateV2');
            if (publicState && lastComplete) {
              lastComplete = Object.freeze({ ...lastComplete, publicState });
            }
            sendBoundResponse(responseTransport, 'PLAYER_SETTING_UPDATE_RESULT', { requestId, ok: true, publicState });
          } catch (error) {
            sendBoundResponse(responseTransport, 'PLAYER_SETTING_UPDATE_RESULT', {
              requestId,
              ok: false,
              error: String(error?.message || error || '设置更新失败'),
            });
          }
        }

        async function handleActionRequest(payload) {
          const responseTransport = captureResponseTransport();
          const requestId = String(payload?.requestId || '');
          try {
            if (!requestId) throw new Error('操作请求 ID 为空');
            const dedupeKey = sessionId + ':' + epoch + ':' + requestId;
            if (handledActionRequestIds.has(dedupeKey)) throw new Error('重复操作已拒绝');
            handledActionRequestIds.add(dedupeKey);
            if (handledActionRequestIds.size > 256) {
              handledActionRequestIds.delete(handledActionRequestIds.values().next().value);
            }
            const action = String(payload?.action || '');
            const allowed = new Set([
              'submitOpening',
              'submitInteractionText',
              'getDifficultyState',
              'getTravelerArchiveState',
              'createTravelerArchive',
              'bindTravelerArchive',
              'exportTravelerArchives',
              'importTravelerArchives',
              'resolveLegacyAwards',
              'resolveLegacyInheritance',
              'updateDifficultyProfile',
              'updateReflectionLimitPolicy',
              'getCardCollectionState',
              'updateCardDeck',
              'setActiveCardDeck',
              'registerCardRewardOffer',
              'settleCardReward',
              'registerCustomContentProposal',
              'settleCustomContentProposal',
              'updateItemLoadout',
              'getFacilityOffers',
              'executeFacilityTransaction',
              'getNonCardResolutionOptions',
              'resolveConflictWithoutCards',
              'registerBattleAttempt',
              'retryCardBattle',
              'registerEncounterClock',
              'updateEncounterClock',
              'resolveChallengeGate',
              'confirmEndingProposal',
              'sealCycleToArchive',
              'claimInteraction',
              'commitInteraction',
              'releaseInteraction',
              'saveBattleCheckpoint',
              'markBattleTerminal',
              'confirmBattleResolution',
            ]);
            if (!allowed.has(action)) throw new Error('宿主未开放该操作');
            const openingAllowed = [
              'submitOpening', 'getDifficultyState', 'updateDifficultyProfile',
              'updateReflectionLimitPolicy', 'getTravelerArchiveState',
              'createTravelerArchive', 'bindTravelerArchive',
              'exportTravelerArchives', 'importTravelerArchives',
              'resolveLegacyAwards',
              'resolveLegacyInheritance',
              'getCardCollectionState', 'updateCardDeck', 'setActiveCardDeck',
              'registerCustomContentProposal', 'settleCustomContentProposal', 'updateItemLoadout',
              'getFacilityOffers', 'executeFacilityTransaction',
            ]
              .includes(action);
            validateLiveBinding(payload?.binding, openingAllowed);
            const controller = readController(action);
            const request = detachedClone(payload?.payload || {});
            if ([
              'submitInteractionText', 'getDifficultyState', 'updateDifficultyProfile',
              'updateReflectionLimitPolicy', 'getTravelerArchiveState',
              'createTravelerArchive', 'bindTravelerArchive',
              'exportTravelerArchives', 'importTravelerArchives',
              'resolveLegacyAwards',
              'resolveLegacyInheritance',
              'getCardCollectionState', 'updateCardDeck',
              'registerCardRewardOffer', 'settleCardReward', 'resolveChallengeGate',
              'registerCustomContentProposal', 'settleCustomContentProposal', 'updateItemLoadout',
              'getFacilityOffers', 'executeFacilityTransaction',
              'getNonCardResolutionOptions', 'resolveConflictWithoutCards',
              'registerBattleAttempt', 'retryCardBattle', 'registerEncounterClock', 'updateEncounterClock',
              'confirmEndingProposal', 'sealCycleToArchive',
            ]
              .includes(action)) {
              request.chatKey = chatKey;
              request.floorIndex = Number(payload.binding.floorIndex);
              request.messageIdCandidates = normalizeIds(payload.binding.messageIdCandidates);
              request.messageId = request.messageIdCandidates[0] ?? Number(payload.binding.floorIndex);
              request.presentationSignature = String(payload.binding.presentationSignature || '');
              request.hostSessionId = sessionId;
              request.hostEpoch = epoch;
            }
            if (action === 'submitInteractionText') {
              request.token = String(request.token || ('mgq-' + epoch + '-' + Math.random().toString(36).slice(2)));
            }
            const result = await Promise.resolve(controller[action](request));
            if (!responseTransportIsCurrent(responseTransport)
              || readChatKey() !== responseTransport.chatKey) return;
            const summary = summarizeActionResult(action, result);
            if (summary.success !== true) throw new Error(summary.error || '操作失败');
            sendBoundResponse(responseTransport, 'ACTION_RESULT', { requestId, ok: true, result: summary });
          } catch (error) {
            sendBoundResponse(responseTransport, 'ACTION_RESULT', {
              requestId,
              ok: false,
              error: String(error?.message || error || '宿主操作失败'),
            });
          }
        }

        function validateLiveBinding(binding, allowOpening) {
          if (!sessionId || !chatKey || readChatKey() !== chatKey) throw new Error('当前聊天已切换');
          if (!binding || typeof binding !== 'object') throw new Error('操作绑定不完整');
          const latest = readLatestAssistant();
          if (!latest) throw new Error('找不到最新助手消息');
          if (latest.presentationSignature !== binding.presentationSignature) throw new Error('操作签名已过期');
          if (latest.floorIndex !== Number(binding.floorIndex)) throw new Error('操作楼层已过期');
          const latestIds = normalizeIds(latest.messageIdCandidates);
          const bindingIds = normalizeIds(binding.messageIdCandidates);
          if (!bindingIds.some(id => latestIds.some(latestId => String(latestId) === String(id)))) {
            throw new Error('操作消息 ID 已过期');
          }
          if (lastComplete) {
            if (lastComplete.readOnly === true) throw new Error('宿主恢复场景为只读，不会重放旧事务');
            if (lastComplete.presentationSignature !== binding.presentationSignature
              || lastComplete.floorIndex !== Number(binding.floorIndex)) {
              throw new Error('宿主当前场景已变更');
            }
            return true;
          }
          if (allowOpening && openingSession && isOpeningMarker(latest.rawText)) return true;
          throw new Error('当前没有可操作的完整场景');
        }

        function readController(method) {
          const context = readContext();
          const candidates = [window.MGQController, window.MGQ?.bridge, window.MGQ, context.MGQController, context.MGQ?.bridge, context.MGQ];
          const controller = candidates.find(value => typeof value?.[method] === 'function');
          if (!controller) throw new Error('MGQController.' + method + ' 不可用');
          return controller;
        }

        function readOpeningMapSnapshot(anchor) {
          try {
            const floor = Number(anchor?.floorIndex);
            const signature = String(anchor?.presentationSignature || '').trim();
            if (!Number.isInteger(floor) || floor < 0 || !signature) return null;
            const controller = readController('getMapPublicState');
            const publicState = detachedClone(controller.getMapPublicState());
            if (publicState?.protocol !== 'mgq-map-public-state/v1'
              || publicState?.atlas_id !== 'hybrid-main') return null;
            return Object.freeze({
              protocol: 'mgq-map-snapshot/v1',
              floor,
              presentation_signature: signature,
              public_state: publicState,
              digest: 'opening-map:' + String(publicState.revision || 0) + ':' + signature,
            });
          } catch (_) {
            return null;
          }
        }

        function scheduleOpeningMapRefresh(expectedRevision, expectedSessionId, expectedEpoch) {
          const signal = abortController.signal;
          const delays = [0, 120, 480, 1200, 3000, 7000];
          const attempt = index => {
            const delay = delays[index];
            if (!Number.isFinite(delay)) return;
            setTimeout(() => {
              if (signal.aborted || destroyed || !isLifecycleCurrent(expectedRevision)) return;
              if (sessionId !== expectedSessionId || epoch !== expectedEpoch) return;
              if (!openingSession || !openingAnchor) return;
              const mapSnapshot = readOpeningMapSnapshot(openingAnchor);
              if (!mapSnapshot) {
                attempt(index + 1);
                return;
              }
              openingAnchor = Object.freeze({
                ...detachedClone(openingAnchor),
                mapSnapshot,
              });
              send('OPENING_BINDING_UPDATED', { openingBinding: openingAnchor });
            }, delay);
          };
          attempt(0);
        }

        function isAllowedPlayerSetting(key, value) {
          if (key === 'battle_mode') return ['叙事', '卡牌', '速判'].includes(value);
          if (key === 'route_mode') return ['正史靠拢', '局部分歧', '重大偏离', '独立世界线'].includes(value);
          return false;
        }

        function sanitizeDifficultyProfile(value) {
          const record = value && typeof value === 'object' && !Array.isArray(value) ? value : null;
          if (!record || record.protocol !== 'mgq-difficulty-profile/v1') return null;
          const presets = new Set(['easy', 'normal', 'hard', 'nightmare', 'madness', 'custom']);
          const rp = record.rp && typeof record.rp === 'object' && !Array.isArray(record.rp) ? record.rp : null;
          const card = record.card && typeof record.card === 'object' && !Array.isArray(record.card) ? record.card : null;
          if (!rp || !card || !presets.has(String(record.overall || ''))
            || !presets.has(String(rp.preset || '')) || !presets.has(String(card.preset || ''))) return null;
          const axesSource = rp.axes && typeof rp.axes === 'object' && !Array.isArray(rp.axes) ? rp.axes : {};
          const axes = {};
          for (const key of [
            'world_resistance', 'information_aid', 'attraction_pressure',
            'consequence_severity', 'check_curve',
          ]) {
            const rank = Number(axesSource[key]);
            if (!Number.isInteger(rank) || rank < 1 || rank > 4) return null;
            axes[key] = rank;
          }
          const retry = card.retry_limit === null ? null : Number(card.retry_limit);
          if (retry !== null && (!Number.isInteger(retry) || retry < 0)) return null;
          return Object.freeze({
            protocol: 'mgq-difficulty-profile/v1',
            overall: String(record.overall),
            rp: Object.freeze({
              preset: String(rp.preset),
              locked: rp.locked === true,
              base_success_rate: Math.max(0, Math.min(100, Number(rp.base_success_rate) || 0)),
              axes: Object.freeze(axes),
            }),
            card: Object.freeze({
              preset: String(card.preset),
              locked: card.locked === true,
              forced_conflicts: card.forced_conflicts === true,
              retry_limit: retry,
              cheats_enabled: card.cheats_enabled === true,
              balance_profile_id: String(card.balance_profile_id || ''),
            }),
          });
        }

        function sanitizeDifficultyActionResult(value) {
          const record = value && typeof value === 'object' && !Array.isArray(value) ? value : {};
          const state = record.state && typeof record.state === 'object' && !Array.isArray(record.state)
            ? record.state : {};
          const profile = sanitizeDifficultyProfile(record.profile || state.difficulty);
          const revision = Number(record.revision ?? state.revision);
          const result = {
            success: true,
            kind: String(record.kind || (record.protocol === 'mgq-difficulty-public-state/v1' ? 'snapshot' : '')),
            selection_confirmed: (record.selection_confirmed ?? state.difficulty?.selection_confirmed) === true,
          };
          if (record.protocol === 'mgq-difficulty-public-state/v1') {
            result.protocol = 'mgq-difficulty-public-state/v1';
          }
          if (profile) result.profile = profile;
          if (Number.isInteger(revision) && revision >= 0) result.revision = revision;
          if (typeof record.safe_to_change === 'boolean') result.safe_to_change = record.safe_to_change;
          const reflectionSource = record.reflection && typeof record.reflection === 'object'
            && !Array.isArray(record.reflection) ? record.reflection : null;
          if (reflectionSource?.protocol === 'mgq-reflection-public-state/v1') {
            const count = Number(reflectionSource.count);
            const pressure = Number(reflectionSource.pressure);
            const limitMode = String(reflectionSource.limit_mode || '');
            const madnessLimit = reflectionSource.madness_limit === null
              ? null
              : Number(reflectionSource.madness_limit);
            const limits = { strict: 12, standard: 18, lenient: 24, unlimited: null };
            if (Number.isInteger(count) && count >= 0
              && Number.isInteger(pressure) && pressure >= 0 && pressure <= 3
              && ['active', 'heaven-locked'].includes(String(reflectionSource.mainline_state || ''))
              && Object.prototype.hasOwnProperty.call(limits, limitMode)
              && madnessLimit === limits[limitMode]) {
              const last = reflectionSource.last_event && typeof reflectionSource.last_event === 'object'
                && !Array.isArray(reflectionSource.last_event)
                ? {
                    reflection_id: String(reflectionSource.last_event.reflection_id || '').trim(),
                    disposition: String(reflectionSource.last_event.disposition || '').trim(),
                    scene_tier: String(reflectionSource.last_event.scene_tier || '').trim(),
                  }
                : null;
              result.reflection = Object.freeze({
                protocol: 'mgq-reflection-public-state/v1',
                count,
                pressure,
                mainline_state: String(reflectionSource.mainline_state),
                limit_mode: limitMode,
                madness_limit: madnessLimit,
                editable: reflectionSource.editable === true,
                last_event: last,
              });
            }
          }
          const lockReason = String(record.lock_reason || record.reason || '').trim();
          if (lockReason) result.lock_reason = lockReason;
          if (Array.isArray(record.errors)) {
            result.errors = record.errors.map(item => String(item || '').trim()).filter(Boolean).slice(0, 8);
          }
          if (result.kind === 'snapshot' && (!profile || !Number.isInteger(result.revision))) {
            return { success: false, error: '难度状态协议无效' };
          }
          return result;
        }

        function sanitizeChallengeActionResult(value) {
          const record = value && typeof value === 'object' && !Array.isArray(value) ? value : {};
          const kind = String(record.kind || '').trim();
          const state = record.state && typeof record.state === 'object' && !Array.isArray(record.state)
            ? record.state : {};
          const output = { success: true, kind };
          const revision = Number(record.revision ?? state.revision);
          if (Number.isInteger(revision) && revision >= 0) output.revision = revision;
          if (Array.isArray(record.errors)) {
            output.errors = record.errors.map(item => String(item || '').trim()).filter(Boolean).slice(0, 8);
          }
          if (!['resolved', 'idempotent'].includes(kind)) return output;
          const result = record.result && typeof record.result === 'object' && !Array.isArray(record.result)
            ? record.result
            : null;
          const dimensions = new Set(['swordsmanship', 'magic', 'willpower', 'insight', 'negotiation']);
          const bands = new Set(['severe_failure', 'failure', 'success', 'major_success']);
          if (!result || result.protocol !== 'mgq-challenge-result/v1'
            || !String(result.challenge_id || '').trim()
            || !Number.isInteger(Number(result.floor)) || Number(result.floor) < 0
            || !String(result.presentation_signature || '').trim()
            || !dimensions.has(String(result.dimension || ''))
            || !Number.isInteger(Number(result.roll)) || Number(result.roll) < 1 || Number(result.roll) > 100
            || !bands.has(String(result.band || ''))
            || !String(result.outcome || '').trim()
            || !Array.isArray(result.matrix)) {
            return { success: false, error: '判定结果协议无效' };
          }
          const matrix = [];
          for (const row of result.matrix) {
            if (!row || typeof row !== 'object' || Array.isArray(row)
              || !dimensions.has(String(row.dimension || ''))
              || !String(row.label || '').trim()) return { success: false, error: '判定矩阵协议无效' };
            const attributeValue = Number(row.attribute_value);
            const estimatedRate = Number(row.estimated_success_rate);
            if (!Number.isFinite(attributeValue) || attributeValue < 0 || attributeValue > 100
              || !Number.isFinite(estimatedRate) || estimatedRate < 0 || estimatedRate > 100) {
              return { success: false, error: '判定矩阵数值无效' };
            }
            matrix.push({
              dimension: String(row.dimension),
              label: String(row.label).trim(),
              attribute_value: attributeValue,
              estimated_success_rate: estimatedRate,
            });
          }
          output.result = Object.freeze({
            protocol: 'mgq-challenge-result/v1',
            challenge_id: String(result.challenge_id).trim(),
            floor: Number(result.floor),
            presentation_signature: String(result.presentation_signature).trim(),
            dimension: String(result.dimension),
            difficulty: String(result.difficulty || '').trim(),
            roll: Number(result.roll),
            attribute_value: Number(result.attribute_value),
            effective_score: Number(result.effective_score),
            threshold: Number(result.threshold),
            band: String(result.band),
